<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <p class="brand-kicker">Bridge</p>
      <h1>Mini-CRM</h1>
    </div>
    <label class="session">Connecté en tant que : <select id="utilisateur"></select></label>
  </header>
  <main>
    <div id="pipeline" class="pipeline"></div>
    <section id="tableau-de-bord" class="dashboard" hidden>
      <h2>Tableau de bord</h2>
      <div class="kpi-grid">
        <article class="kpi kpi-main">
          <p class="kpi-label">Pipeline en cours</p>
          <p class="kpi-value"><b id="total"></b></p>
        </article>
        <article class="kpi kpi-stages">
          <p class="kpi-label">Par étape</p>
          <p class="kpi-value kpi-value-sm"><span id="par-etape"></span></p>
        </article>
      </div>
    </section>
  </main>
  <dialog id="fiche" aria-labelledby="fiche-titre">
    <form id="form-fiche">
      <h2 id="fiche-titre"></h2>
      <p id="fiche-meta"></p>
      <input type="hidden" id="fiche-id">
      <label>Contact <input id="fiche-contact" name="contact" required></label>
      <label>Téléphone <input id="fiche-telephone" name="telephone" required></label>
      <label>Montant (FCFA) <input id="fiche-montant" name="montant_fcfa" type="number" min="0" step="1" required></label>
      <label>Étape
        <select id="fiche-etape" name="etape"></select>
      </label>
      <label id="fiche-proprietaire-champ" hidden>Attribuer à
        <select id="fiche-proprietaire" name="proprietaire"></select>
      </label>
      <menu>
        <button type="button" class="btn btn-secondary" id="fiche-fermer">Fermer</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </menu>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
